<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NSAT — Sign in</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="login-wrap">
    <div class="card login-card">
      <h1>NSAT<span style="color:var(--primary)">.</span></h1>
      <p class="muted" style="font-size:13px;margin-bottom:18px">Network Security Audit Tool</p>

      <form id="login-form">
        <div style="margin-bottom:14px">
          <label for="username">Username</label>
          <input id="username" name="username" maxlength="64" required autocomplete="username" />
        </div>
        <div style="margin-bottom:16px">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" maxlength="128" required autocomplete="current-password" />
        </div>
        <button type="submit" style="width:100%">Sign in</button>
      </form>

      <div id="login-msg"></div>
      <p class="muted mono mt" style="font-size:12px;text-align:center">demo — admin / nsat@123</p>
    </div>
  </div>
  <script src="/js/app.js"></script>
  <script>initLogin();</script>
</body>
</html>
